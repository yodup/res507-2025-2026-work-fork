name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: labs/20-containerized-node-app/app
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: labs/20-containerized-node-app/app
        run: |
          node --check app.js
          node --check server.js

      - name: Build Docker image
        working-directory: labs/20-containerized-node-app
        run: docker build -t quote-app -f docker/Dockerfile .

      - name: Run container smoke test
        run: |
          docker run -d --name quote-app -p 3000:3000 quote-app
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --connect-timeout 1 --max-time 2 \
              http://localhost:3000/health -o /tmp/quote-app-health.json \
              && node -e 'const assert = require("node:assert/strict"); const fs = require("node:fs"); assert.equal(JSON.parse(fs.readFileSync("/tmp/quote-app-health.json", "utf8")).ok, true);'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          exit 1

      - name: Show container diagnostics
        if: failure()
        run: |
          docker ps -a
          docker inspect quote-app || true
          docker logs quote-app || true

      - name: Stop container
        if: always()
        run: docker rm -f quote-app || true  

      - name: Construire l'image de production
        run: docker build -t app:ci .

      - name: Démarrer les services
        run: docker compose -f compose-ci.yml up -d

      - name: Attendre la disponibilité de l'application
        run: |
          echo "Vérification de la disponibilité de l'API..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:3000/ > /dev/null; then
              echo "L'application répond (tentative $i)."
              exit 0
            fi
            sleep 2
          done
          echo "Erreur : délai d'attente dépassé pour l'application."
          exit 1

      - name: Exécuter les assertions fonctionnelles
        run: |
          set -e
          RESPONSE_INIT=$(curl -s http://localhost:3000/)
          echo "Réponse initiale : $RESPONSE_INIT"
          echo "$RESPONSE_INIT" | grep -q "Stay hungry, stay foolish"

          PAYLOAD='{"quote": "Talk is cheap. Show me the code."}'
          POST_RES=$(curl -s -X POST http://localhost:3000/quotes \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Réponse POST : $POST_RES"

          FETCH_RES=$(curl -s http://localhost:3000/quotes)
          echo "Réponse GET /quotes : $FETCH_RES"
          echo "$FETCH_RES" | grep -q "Talk is cheap. Show me the code."

      - name: Extraire les journaux en cas d'échec
        if: failure()
        run: docker compose -f compose-ci.yml logs

      - name: Arrêter et nettoyer les conteneurs
        if: always()
        run: docker compose -f compose-ci.yml down -v      