<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Schéma A : tourne dans (frontières)</title>
<desc>Matériel hôte, hyperviseur VirtualBox, VM Ubuntu nœud k3s, namespace quote-lab avec les pods de l'application et PostgreSQL avec son PVC</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.th{font-size:14px;font-weight:bold}.ts{font-size:12px}</style>
<rect x="30" y="20" width="620" height="420" rx="20" fill="none" stroke="#888780" stroke-width="1"/>
<text class="th" x="52" y="46" fill="#888780">Ordinateur hôte</text>
<text class="ts" x="170" y="46" fill="#888780">matériel : CPU, RAM, disque</text>
<rect x="50" y="60" width="580" height="360" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="72" y="86" fill="#444441">Hyperviseur VirtualBox</text>
<text class="ts" x="240" y="86" fill="#5F5E5A">crée et isole la VM</text>
<rect x="70" y="100" width="540" height="300" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="92" y="126" fill="#085041">VM Ubuntu = nœud Kubernetes (k3s)</text>
<text class="ts" x="92" y="144" fill="#0F6E56">Un seul noyau invité, partagé par tous les conteneurs</text>
<rect x="90" y="158" width="500" height="222" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="108" y="178" fill="#444441">namespace quote-lab</text>
<rect x="110" y="190" width="270" height="170" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="126" y="212" fill="#3C3489">Deployment quote-app</text>
<text class="ts" x="126" y="230" fill="#534AB7">3 réplicas, sonde /health</text>
<text class="ts" x="126" y="346" fill="#534AB7">Service quote-app devant les pods</text>
<g fill="#FFFFFF" stroke="#888780" stroke-width="1">
<rect x="124" y="244" width="72" height="56" rx="6"/><rect x="206" y="244" width="72" height="56" rx="6"/><rect x="288" y="244" width="72" height="56" rx="6"/>
<rect x="416" y="244" width="138" height="48" rx="6"/><rect x="416" y="302" width="138" height="48" rx="6"/></g>
<g text-anchor="middle">
<text class="th" x="160" y="264" fill="#2C2C2A">Pod 1</text><text class="ts" x="160" y="284" fill="#5F5E5A">conteneur</text>
<text class="th" x="242" y="264" fill="#2C2C2A">Pod 2</text><text class="ts" x="242" y="284" fill="#5F5E5A">conteneur</text>
<text class="th" x="324" y="264" fill="#2C2C2A">Pod 3</text><text class="ts" x="324" y="284" fill="#5F5E5A">conteneur</text></g>
<rect x="400" y="190" width="170" height="170" rx="8" fill="none" stroke="#993C1D" stroke-width="1"/>
<rect x="400" y="190" width="170" height="170" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="416" y="212" fill="#712B13">Deployment quote-db</text>
<text class="ts" x="416" y="230" fill="#993C1D">1 réplica, Recreate</text>
<g fill="#FFFFFF" stroke="#888780" stroke-width="1"><rect x="416" y="244" width="138" height="48" rx="6"/><rect x="416" y="302" width="138" height="48" rx="6"/></g>
<g text-anchor="middle">
<text class="th" x="485" y="262" fill="#2C2C2A">Pod PostgreSQL</text><text class="ts" x="485" y="280" fill="#5F5E5A">postgres:18</text>
<text class="th" x="485" y="320" fill="#2C2C2A">PVC quote-db-data</text><text class="ts" x="485" y="338" fill="#5F5E5A">local-path, 1 Gi</text></g>
<text class="ts" x="92" y="392" fill="#0F6E56">Service quote-db (non dessiné) = adresse interne de la base</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
