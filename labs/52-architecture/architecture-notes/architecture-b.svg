<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Schéma B : chemins de trafic</title>
<desc>Accès par port-forward vers un seul pod, chemin dans le cluster via le Service avec trois pods, puis accès à PostgreSQL et son PVC</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.th{font-size:14px;font-weight:bold}.ts{font-size:12px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="40" y="36" fill="#888780">Accès depuis l'ordinateur (temporaire, un seul pod)</text>
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"><rect x="40" y="48" width="130" height="56" rx="8"/><rect x="196" y="48" width="130" height="56" rx="8"/></g>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"><rect x="352" y="48" width="130" height="56" rx="8"/><rect x="508" y="48" width="130" height="56" rx="8"/></g>
<g text-anchor="middle">
<text class="th" x="105" y="68" fill="#444441">Navigateur</text><text class="ts" x="105" y="88" fill="#5F5E5A">localhost:8080</text>
<text class="th" x="261" y="68" fill="#444441">Tunnel PC-VM</text><text class="ts" x="261" y="88" fill="#5F5E5A">VS Code Ports / SSH</text>
<text class="th" x="417" y="68" fill="#085041">port-forward</text><text class="ts" x="417" y="88" fill="#0F6E56">temporaire, 8080</text>
<text class="th" x="573" y="68" fill="#085041">Pod quote-app</text><text class="ts" x="573" y="88" fill="#0F6E56">un seul, choisi</text></g>
<g stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#a)"><line x1="170" y1="76" x2="194" y2="76"/><line x1="326" y1="76" x2="350" y2="76"/><line x1="482" y1="76" x2="506" y2="76"/></g>
<text class="ts" x="40" y="140" fill="#888780">Chemin dans le cluster (répartition et base de données)</text>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"><rect x="40" y="152" width="130" height="56" rx="8"/><rect x="196" y="152" width="130" height="56" rx="8"/><rect x="352" y="152" width="130" height="56" rx="8"/></g>
<g fill="#FAECE7" stroke="#993C1D" stroke-width="1"><rect x="508" y="152" width="130" height="56" rx="8"/><rect x="508" y="250" width="130" height="56" rx="8"/><rect x="352" y="250" width="130" height="56" rx="8"/></g>
<g text-anchor="middle">
<text class="th" x="105" y="172" fill="#085041">service-check</text><text class="ts" x="105" y="192" fill="#0F6E56">client in-cluster</text>
<text class="th" x="261" y="172" fill="#085041">Service app</text><text class="ts" x="261" y="192" fill="#0F6E56">quote-app:80</text>
<text class="th" x="417" y="172" fill="#085041">Pods quote-app</text><text class="ts" x="417" y="192" fill="#0F6E56">3 réplicas</text>
<text class="th" x="573" y="172" fill="#712B13">Service BD</text><text class="ts" x="573" y="192" fill="#993C1D">quote-db:5432</text>
<text class="th" x="573" y="270" fill="#712B13">Pod PostgreSQL</text><text class="ts" x="573" y="290" fill="#993C1D">postgres:18</text>
<text class="th" x="417" y="270" fill="#712B13">PVC</text><text class="ts" x="417" y="290" fill="#993C1D">quote-db-data</text></g>
<g stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#a)"><line x1="170" y1="180" x2="194" y2="180"/><line x1="326" y1="180" x2="350" y2="180"/><line x1="482" y1="180" x2="506" y2="180"/><line x1="573" y1="208" x2="573" y2="248"/><line x1="508" y1="278" x2="484" y2="278"/></g>
<text class="ts" x="40" y="340" fill="#888780">Gris : ordinateur. Vert : cluster. Corail : base de données.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
